<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline | Pakistan Peoples Party District Dadu</title>
    <meta name="theme-color" content="#0b603d">
    <style>
        :root {
            --ppp-green: #0b603d;
            --ppp-green-dark: #07472c;
            --ppp-red: #dc2626;
            --ppp-gold: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f4f7f5;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .offline-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
            max-width: 440px;
            width: 100%;
            text-align: center;
            padding: 36px 28px;
            overflow: hidden;
            position: relative;
        }
        .offline-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #111 33.3%, var(--ppp-red) 33.3%, var(--ppp-red) 66.6%, var(--ppp-green) 66.6%);
        }
        .offline-icon-wrap {
            width: 80px;
            height: 80px;
            background: #ecfdf5;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 2px dashed #a7f3d0;
        }
        .offline-icon-wrap svg {
            width: 40px;
            height: 40px;
            stroke: var(--ppp-green);
        }
        .offline-title {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 10px;
        }
        .offline-desc {
            font-size: 14.5px;
            line-height: 1.55;
            color: #4b5563;
            margin-bottom: 24px;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--ppp-green);
            color: #ffffff;
            font-weight: 600;
            font-size: 14.5px;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
            box-shadow: 0 4px 10px rgba(11, 96, 61, 0.25);
        }
        .btn-retry:hover {
            background: var(--ppp-green-dark);
        }
        .offline-brand {
            margin-top: 24px;
            font-size: 12px;
            color: #9ca3af;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon-wrap">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.828m2.829 2.828L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.828m-4.243 4.243a9 9 0 01-2.828-2.828m0 0l2.828-2.829m-2.828 2.829L3 21M3 3l18 18" />
            </svg>
        </div>
        <h1 class="offline-title">You're Currently Offline</h1>
        <p class="offline-desc">
            It looks like your internet connection is unavailable. Cached articles and previously loaded pages can still be viewed inside the app.
        </p>
        <button class="btn-retry" onclick="window.location.reload();">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Retry Connection
        </button>
        <div class="offline-brand">
            Pakistan Peoples Party &bull; District Dadu
        </div>
    </div>
</body>
</html>
